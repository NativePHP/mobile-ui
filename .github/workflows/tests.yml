name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pest:
    name: Plugin tests (Pest) - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # Keep 8.3: it's our minimum, matching nativephp/mobile. If a
        # dependency stops installing on it, loosen that constraint instead
        # of dropping this leg.
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Unlike the leaf plugins, this suite exercises nativephp/mobile at
      # runtime (the Edge element collector, elements, facades), so CI must
      # actually install it. Now that v4 has shipped, the nativephp/mobile
      # constraint in composer.json resolves straight from Packagist — no VCS
      # repository, stability tweaks or access token involved, so forks
      # build the same way we do.
      #
      # `update` rather than `install`: composer.lock is gitignored, so
      # there is never a lock file to install from.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/pest --colors=always

      - name: Lint PHP sources
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  swift-parse:
    name: Swift syntax check
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Full compilation needs the NativePHP Xcode project (BridgeFunction,
      # NativeUINode etc. live in the app target), so CI runs a parse-only
      # pass: it catches syntax errors — the realistic failure mode for a
      # plugin PR — without resolving types. Kotlin has no parse-only mode
      # (kotlinc always typechecks), so Android syntax is covered by the
      # consuming app build instead.
      - name: Parse Swift sources
        run: |
          set -e
          for f in resources/ios/*.swift; do
            echo "parsing $f"
            xcrun swiftc -parse "$f"
          done
